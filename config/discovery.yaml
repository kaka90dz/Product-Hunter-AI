# Moteur de découverte : requêtes de départ, vocabulaire produit, filtres de risque.
# Ce sont des paramètres de recherche, pas des données de marché.

# Régions de recherche par langue (la région de recherche n'est PAS le pays de l'audience).
regions_by_language:
  en: [US, GB, AU, CA, IE, NZ]
  fr: [FR, BE, CA, CH]
  de: [DE, AT, CH]
  es: [ES]
  it: [IT]
  nl: [NL, BE]
  pt: [PT]
  pl: [PL]
  sv: [SE]

# Requêtes génériques à intention d'achat
generic_queries:
  en: ["tiktok made me buy it", "amazon finds", "gadgets you need", "must have products", "problem solving products", "useful gadgets", "unboxing gadget", "life hack product"]
  fr: ["trouvailles amazon", "gadget utile", "objet malin", "produit tiktok", "achat utile maison"]
  de: ["amazon fundstücke", "nützliche gadgets", "geniale erfindungen", "tiktok produkte"]
  es: ["productos virales", "gadgets útiles", "cosas de amazon", "tiktok me hizo comprarlo"]
  it: ["prodotti virali", "gadget utili", "acquisti amazon utili"]
  nl: ["handige gadgets", "amazon vondsten"]
  pt: ["achados amazon", "gadgets úteis"]
  pl: ["przydatne gadżety", "gadżety z amazon"]
  sv: ["smarta prylar"]

# Niches explorées (termes de recherche par langue)
niches:
  musculation: {fr: Musculation, q: {en: "gym accessories", fr: "accessoire musculation", de: "fitness zubehör", es: "accesorios gimnasio", it: "accessori palestra"}}
  fitness_maison: {fr: Fitness à la maison, q: {en: "home workout gadget", fr: "sport maison accessoire", de: "home workout gadget", es: "ejercicio en casa accesorio", it: "allenamento casa accessorio"}}
  automobile: {fr: Automobile, q: {en: "car accessories", fr: "accessoire voiture", de: "auto zubehör", es: "accesorios coche", it: "accessori auto"}}
  chiens: {fr: Chiens, q: {en: "dog gadgets", fr: "accessoire chien", de: "hunde zubehör", es: "accesorios perro", it: "accessori cane"}}
  chats: {fr: Chats, q: {en: "cat gadgets", fr: "accessoire chat", de: "katzen zubehör", es: "accesorios gato", it: "accessori gatto"}}
  voyage: {fr: Voyage, q: {en: "travel gadgets", fr: "accessoire voyage", de: "reise gadgets", es: "accesorios viaje", it: "accessori viaggio"}}
  maison: {fr: Maison, q: {en: "home gadgets", fr: "gadget maison", de: "haushalt gadgets", es: "gadgets hogar", it: "gadget casa"}}
  rangement: {fr: Rangement et organisation, q: {en: "organization products", fr: "rangement astuce", de: "aufbewahrung ideen", es: "organizador hogar", it: "organizzatore casa"}}
  cuisine: {fr: Cuisine, q: {en: "kitchen gadgets", fr: "ustensile cuisine pratique", de: "küchen gadgets", es: "gadgets cocina", it: "gadget cucina"}}
  jardin: {fr: Jardin, q: {en: "garden gadgets", fr: "accessoire jardin", de: "garten gadgets", es: "accesorios jardín", it: "accessori giardino"}}
  mode: {fr: Accessoires de mode, q: {en: "fashion accessories haul", fr: "accessoire mode", de: "mode accessoires", es: "accesorios moda", it: "accessori moda"}}
  tech: {fr: Accessoires tech, q: {en: "phone accessories", fr: "accessoire téléphone", de: "handy zubehör", es: "accesorios celular", it: "accessori telefono"}}
  bureau: {fr: Bureau, q: {en: "desk setup accessories", fr: "accessoire bureau", de: "schreibtisch zubehör", es: "accesorios escritorio", it: "accessori scrivania"}}
  outdoor: {fr: Plein air, q: {en: "camping gadgets", fr: "accessoire camping", de: "camping gadgets", es: "accesorios camping", it: "accessori campeggio"}}
  createurs: {fr: Créateurs de contenu, q: {en: "content creator gear", fr: "matériel créateur de contenu", de: "content creator zubehör", es: "accesorios para creadores", it: "accessori per creator"}}
  salle_de_bain: {fr: Salle de bain, q: {en: "bathroom gadgets", fr: "accessoire salle de bain", de: "badezimmer gadgets", es: "accesorios baño", it: "accessori bagno"}}

