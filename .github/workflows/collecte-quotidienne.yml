name: Collecte quotidienne (mode Eco, sans IA)

on:
  schedule:
    - cron: "17 5 * * *"     # chaque jour à 05:17 UTC
  workflow_dispatch:          # bouton « Run workflow » / déclenchement depuis le tableau de bord
    inputs:
      force:
        description: "Ignorer le cache"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Collecte
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m phai collect ${{ inputs.force && '--force' || '' }}
      - run: python -m phai status
      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "product-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.db
          if git diff --cached --quiet; then echo "Aucune nouvelle donnée"; exit 0; fi
          git commit -m "Données : collecte du $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
